name: alhayaa
description: "الحياة — متجر مستحضرات التجميل"
publish_to: 'none'
version: 1.1.0+12

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # UI / UX
  cached_network_image: ^3.4.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.6
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  mobile_scanner: ^7.0.1
  package_info_plus: ^8.3.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  hugeicons: ^1.2.0
  flutter_svg: ^2.3.0

  # الاتصال والمشاركة وإعدادات النظام — إصدارات مثبّتة بالضبط (صدرت قبل أسبوعين على الأقل).
  # app_settings ثابت على 7.0.0: الإصدار 8 وما بعده ترك CocoaPods، ومشروع iOS هنا عليها.
  # لا مكتبة صوت: قرار المالك ألا ميكروفون في التطبيق (ومكتبة مربوطة بلا أذوناتها تُرفض في App Store).
  connectivity_plus: 7.3.1
  share_plus: 12.0.2
  app_settings: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_brand.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_brand_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/worlds/
    - assets/images/alhayat_butterfly_logo.png
    - assets/images/app_icon_brand_foreground.png
    - assets/fonts/licenses/

  # الخطوط مضمّنة في التطبيق: لا تحميل وقت التشغيل، والأوزان الحقيقية تظهر من أول إطار.
  # المحرك يختار الملف الأقرب لكل fontWeight (w800/w900 تُرسم من Bold 700).
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Medium.ttf
          weight: 500
